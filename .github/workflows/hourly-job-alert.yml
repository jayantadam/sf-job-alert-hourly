
on:
  schedule:
    # Every 30 minutes, 24x7 (at :17 and :47 past each hour; free & unlimited on a PUBLIC repo).
    # Do NOT use this on a private repo (it would need ~8,600 min/month; free limit is 2,000).
    - cron: "17,47 * * * *"
  workflow_dispatch: {}          # "Run workflow" button; also used by the self-restart below

# Allows the workflow to start its own next run (self-restart every 30 min)
permissions:
  contents: read
  actions: write

# never let two runs overlap (prevents double emails to recruiters)
concurrency:
  group: hourly-job-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # cache the Chromium download so each run is ~1 min faster
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install browser for Naukri
        run: python -m playwright install --with-deps chromium

      # Memory of jobs already emailed / applied. Kept in the private Actions cache
      # (not committed), so it stays hidden even if the repo is public.
      - name: Restore job history
        uses: actions/cache/restore@v4
        with:
          path: |
            seen_jobs.json
            applied_jobs.json
            state.json
            first_seen.json
          key: job-state-${{ github.run_id }}
          restore-keys: job-state-

      - name: Search jobs, email recruiters, send alert
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Public repo: keep your profile & resume in Secrets (NOT as files in the repo)
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
          RESUME_BASE64: ${{ secrets.RESUME_BASE64 }}
          TZ: Asia/Kolkata             # show times in IST
          TO_EMAIL: ${{ secrets.TO_EMAIL }}       # hidden (public repo); falls back to GMAIL_USER
          QUIET_LOGS: "true"                        # don't print company/recruiter names in public logs
          MIN_EXP: "4"
          MAX_EXP: "8"
          WINDOW_HOURS: "0.5"          # only jobs posted in the last 30 minutes
          MAX_WINDOW_HOURS: "0.75"     # small stretch only when GitHub starts a run late (no gaps, no old jobs)
          SEND_IF_EMPTY: "false"       # no email when nothing was posted in the last hour
          USE_LINKEDIN: "true"
          USE_NAUKRI: "true"
          # extra portals (remove any you don't want)
          # all extra portals (TimesJobs & Instahyre: a job is "new" the first hour it appears)
          OTHER_SOURCES: "Foundit,Shine,Cutshort,Talent.com,TimesJobs,Instahyre"
          # ---- auto-apply by emailing recruiters ----
          AUTO_APPLY: "true"           # email recruiters your resume (needs PROFILE_JSON + RESUME_BASE64 secrets)
          MAX_AUTO_APPLY_PER_RUN: "5"
          MAX_AUTO_APPLY_PER_DAY: "15"
        run: python job_alert.py

      - name: Save job history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            seen_jobs.json
            applied_jobs.json
            state.json
            first_seen.json
          key: job-state-${{ github.run_id }}

  # ─────────────────────────────────────────────────────────────────────────────
  # SELF-RESTART: GitHub's own cron is often late or skipped (especially on new repos).
  # After each run, wait until the next :17 / :47 slot, then start the next run.
  # Just click "Run workflow" ONCE and it keeps going by itself, forever (free on a public repo).
  # The cron schedule above stays as a backup that restarts the chain if it ever breaks.
  # ─────────────────────────────────────────────────────────────────────────────
  next-run:
    needs: alert
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for the next 30-minute slot
        run: |
          now=$(date +%s)
          m=$(date +%-M); s=$(date +%-S)
          # seconds until the next :17 or :47
          for slot in 17 47 77; do
            wait=$(( (slot - m) * 60 - s ))
            [ $wait -ge 300 ] && break      # at least 5 min away
          done
          echo "Sleeping $((wait / 60)) min until the next slot"
          sleep $wait

      - name: Start the next run (unless one is already waiting)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          waiting=$(gh run list --workflow hourly-job-alert.yml --limit 20 --json status,databaseId \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status==\"queued\" or .status==\"waiting\" or .status==\"pending\" or .status==\"requested\" or .status==\"in_progress\")] | length")
          if [ "$waiting" -gt 0 ]; then
            echo "Another run is already queued/running: not starting a duplicate."
          else
            gh workflow run hourly-job-alert.yml --ref "${{ github.ref_name }}"
            echo "Next run started."
          fi