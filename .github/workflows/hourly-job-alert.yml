name: Hourly Salesforce Job Alert

on:
  schedule:
    # Cron times are UTC (IST = UTC + 5:30).
    # 02:30 UTC = 8:00 AM IST → starts the day's 20-minute chain.
    - cron: "30 2 * * *"
    # BACKUP every 20 min from 8:30 AM to 11:10 PM IST: restarts the chain if it ever stops
    # (skips itself while the chain is running). Nothing runs overnight.
    - cron: "0,20,40 3-17 * * *"
  workflow_dispatch:             # "Run workflow" button; also used by the self-restart below
    inputs:
      chained:
        description: "Started automatically by the previous run (leave false)"
        required: false
        default: "false"

# ── ACTIVE HOURS (IST) ── change these two numbers to change the daily window.
# If you change them, also change the two cron lines above (UTC = IST - 5:30).
env:
  START_HOUR_IST: "8"      # first run  8:00 AM IST
  END_HOUR_IST: "23"       # last run starts before 11:00 PM IST

# Allows the workflow to start its own next run (self-restart every 20 min)
permissions:
  contents: read
  actions: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # GUARD: keeps exactly ONE 20-minute chain alive.
  #  • Manual "Run workflow" click → always runs.
  #  • Chained run (started by the previous run) → stops if a newer chain already ran < 10 min ago
  #    (this kills duplicate chains, which caused the "next run after 6 minutes" problem).
  #  • Backup cron → runs ONLY if the chain has died (no run in the last 25 min).
  #  • Outside active hours (default 8 AM–11 PM IST) → scheduled/chained runs cancel themselves.
  # Skipped runs cancel themselves, so they show as grey "cancelled". That's normal.
  # ─────────────────────────────────────────────────────────────────────────────
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          CHAINED: ${{ inputs.chained }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$CHAINED" != "true" ]; then
            echo "Manual run: go."; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          now=$(( 10#$(TZ=Asia/Kolkata date +%H) * 60 + 10#$(TZ=Asia/Kolkata date +%M) ))
          if [ $now -lt $(( START_HOUR_IST * 60 )) ] || [ $now -gt $(( END_HOUR_IST * 60 + 10 )) ]; then
            echo "Outside active hours ($START_HOUR_IST:00 to $END_HOUR_IST:00 IST): not running, cancelling."
            echo "go=false" >> "$GITHUB_OUTPUT"
            gh run cancel ${{ github.run_id }}
            sleep 60; exit 0
          fi
          if [ "$EVENT" = "schedule" ]; then mins=25; else mins=10; fi
          me=$(gh run view ${{ github.run_id }} --json createdAt --jq .createdAt)
          cutoff=$(date -u -d "$me - $mins minutes" +%Y-%m-%dT%H:%M:%SZ)
          # chained runs only give way to other chained/manual runs (never to a backup run)
          if [ "$EVENT" = "schedule" ]; then ev='.'; else ev='select(.event != "schedule")'; fi
          recent=$(gh run list --workflow hourly-job-alert.yml --limit 30 --json databaseId,conclusion,createdAt,event \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | $ev | select(.conclusion != \"cancelled\" and .conclusion != \"skipped\") | select(.createdAt > \"$cutoff\" and .createdAt < \"$me\")] | length")
          if [ "$recent" -gt 0 ]; then
            echo "Another run started in the $mins min before this one: this one is not needed, cancelling."
            echo "go=false" >> "$GITHUB_OUTPUT"
            gh run cancel ${{ github.run_id }}
            sleep 60
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  alert:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    # never let two job searches overlap (prevents double emails to recruiters)
    concurrency:
      group: hourly-job-alert
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # cache the Chromium download so each run is ~1 min faster
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install browser for Naukri
        run: python -m playwright install --with-deps chromium

      # Memory of jobs already emailed / applied. Kept in the private Actions cache
      # (not committed), so it stays hidden even if the repo is public.
      - name: Restore job history
        uses: actions/cache/restore@v4
        with:
          path: |
            seen_jobs.json
            applied_jobs.json
            state.json
            first_seen.json
          key: job-state-${{ github.run_id }}
          restore-keys: job-state-

      - name: Search jobs, email recruiters, send alert
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Public repo: keep your profile & resume in Secrets (NOT as files in the repo)
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
          RESUME_BASE64: ${{ secrets.RESUME_BASE64 }}
          TZ: Asia/Kolkata             # show times in IST
          TO_EMAIL: ${{ secrets.TO_EMAIL }}       # hidden (public repo); falls back to GMAIL_USER
          QUIET_LOGS: "true"                        # don't print company/recruiter names in public logs
          MIN_EXP: "4"
          MAX_EXP: "8"
          WINDOW_HOURS: "0.34"         # jobs posted since the previous run (about 20 minutes)
          # Normally each run looks back ~20 min (to the previous run). The first run of the morning
          # looks back to last night's final run, so jobs posted overnight are NOT missed.
          MAX_WINDOW_HOURS: "10"
          SEND_IF_EMPTY: "false"       # no email when nothing new was posted
          USE_LINKEDIN: "true"
          USE_NAUKRI: "true"
          # LinkedIn + Naukri are searched on EVERY run (every 20 min).
          # If they start blocking (0 listings / 429 in the log), set "40" = every other run.
          STRICT_EVERY_MIN: "0"
          # all extra portals (TimesJobs & Instahyre: a job is "new" the first hour it appears)
          OTHER_SOURCES: "Foundit,Shine,Cutshort,Talent.com,TimesJobs,Instahyre"
          # ---- auto-apply by emailing recruiters ----
          AUTO_APPLY: "true"           # email recruiters your resume (needs PROFILE_JSON + RESUME_BASE64 secrets)
          MAX_AUTO_APPLY_PER_RUN: "5"
          MAX_AUTO_APPLY_PER_DAY: "15"
        run: python job_alert.py

      - name: Save job history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            seen_jobs.json
            applied_jobs.json
            state.json
            first_seen.json
          key: job-state-${{ github.run_id }}

  # ─────────────────────────────────────────────────────────────────────────────
  # SELF-RESTART: starts the next run exactly 20 minutes after this run started,
  # until 11 PM IST. Then it stops for the night; the 8 AM cron starts it again next morning.
  # The cron schedule above is only a backup that restarts the chain if it ever breaks.
  # ─────────────────────────────────────────────────────────────────────────────
  next-run:
    needs: [guard, alert]
    if: always() && needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait until 20 minutes after this run started
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INTERVAL_MIN: "20"
        run: |
          started=$(gh run view ${{ github.run_id }} --json createdAt --jq .createdAt)
          target=$(( $(date -d "$started" +%s) + INTERVAL_MIN * 60 ))
          wait=$(( target - $(date +%s) ))
          [ $wait -lt 60 ] && wait=60
          nxt=$(( 10#$(TZ=Asia/Kolkata date -d "@$target" +%H) * 60 + 10#$(TZ=Asia/Kolkata date -d "@$target" +%M) ))
          if [ $nxt -ge $(( END_HOUR_IST * 60 )) ] || [ $nxt -lt $(( START_HOUR_IST * 60 )) ]; then
            echo "Next slot is outside active hours: stopping for the night. Restarts at $START_HOUR_IST:00 AM IST."
            echo "STOP=true" >> "$GITHUB_ENV"; exit 0
          fi
          echo "This run started at $(TZ=Asia/Kolkata date -d "$started" '+%I:%M %p IST')."
          echo "Next run at about $(TZ=Asia/Kolkata date -d "@$(( $(date +%s) + wait ))" '+%I:%M %p IST') (sleeping $((wait / 60)) min)."
          sleep $wait

      - name: Start the next run
        if: env.STOP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run hourly-job-alert.yml --ref "${{ github.ref_name }}" -f chained=true
          echo "Next run started."
